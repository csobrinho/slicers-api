name: Build and Push Docker Images

on:
  push:
    branches:
      - "profile-resolver"
  workflow_dispatch:
    inputs:
      orca_version:
        description: "OrcaSlicer version"
        required: false
        default: "2.3.0"
      bambu_version:
        description: "BambuStudio version"
        required: false
        default: "02.06.00.51"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        slicer:
          - label: "Orca v${{ inputs.orca_version }}"
            dockerfile: tests/docker/Dockerfile.test
            tag: orca-v${{ inputs.orca_version }}
            build_arg_name: ORCA_VERSION
            build_arg_value: ${{ inputs.orca_version }}
          - label: "BambuStudio v${{ inputs.bambu_version }}"
            dockerfile: tests/docker/Dockerfile.test.bambu-studio
            tag: bambu-v${{ inputs.bambu_version }}
            build_arg_name: BAMBU_VERSION
            build_arg_value: ${{ inputs.bambu_version }}
    runs-on: ${{ matrix.platform.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v
        with:
          context: .
          file: ${{ matrix.slicer.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ matrix.slicer.tag }}
          build-args: ${{ matrix.slicer.build_arg_name }}=${{ matrix.slicer.build_arg_value }}
          cache-from: type=gha,scope=${{ matrix.slicer.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slicer.tag }}

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
